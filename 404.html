<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Page not found | Wermyle</title>
<meta name="robots" content="noindex">
<!-- GitHub Pages shows this page for any missing address, even deep ones, so every link starts with "/" -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta name="theme-color" content="#bc9fcb">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,700;0,800;1,800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column}
.top{position:fixed;top:0;left:0;right:0;z-index:6}
.top .brand{color:var(--ink)}
.lost{flex:1;display:grid;place-items:center;padding:110px 16px 60px;text-align:center}
.stage{position:relative;display:grid;place-items:center;width:min(560px,92vw)}
.big{position:absolute;inset:auto 0 18%;font-weight:800;font-size:clamp(150px,34vw,300px);line-height:1;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:3px color-mix(in srgb,var(--band) 70%,transparent);user-select:none;pointer-events:none}
.who{position:relative;display:block;width:min(300px,62vw);padding:0;border:0;background:none;cursor:pointer;animation:bob 3.2s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.who img{display:block;width:100%;height:auto;filter:drop-shadow(0 24px 40px rgba(0,0,0,.45));-webkit-mask:linear-gradient(180deg,#000 78%,transparent);mask:linear-gradient(180deg,#000 78%,transparent)}
.who.shake{animation:shake .5s ease}
@keyframes bob{50%{transform:translateY(-12px) rotate(-2deg)}}
@keyframes shake{20%{transform:rotate(-8deg) scale(1.03)}45%{transform:rotate(7deg)}70%{transform:rotate(-4deg)}100%{transform:none}}
.bubble{position:absolute;top:6%;right:-2%;max-width:200px;padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--paper);color:var(--dark-ink);font-weight:800;font-size:14px;line-height:1.3;box-shadow:0 10px 24px rgba(0,0,0,.35);opacity:0;transform:translateY(8px) scale(.9);transition:opacity .25s,transform .25s;pointer-events:none}
.bubble.on{opacity:1;transform:none}
h1{margin:26px 0 0;font-size:clamp(28px,5vw,44px);font-weight:800;color:var(--head);text-transform:uppercase}
.lost p{margin:12px auto 26px;max-width:42ch;color:var(--soft);font-size:17px}
.go{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn.line{background:transparent;color:var(--head);box-shadow:inset 0 0 0 2px var(--head)}
.btn.line:hover{background:var(--head);color:var(--night)}
@media (max-width:560px){.bubble{right:0;top:0}}
@media (prefers-reduced-motion:reduce){.who{animation:none}}
</style>
</head>
<body>
<div id="mq" aria-hidden="true"></div>
<header class="top"><div class="bar"><a class="brand" href="/">WERMYLE</a></div></header>

<main class="lost">
  <div>
    <div class="stage">
      <span class="big" aria-hidden="true">404</span>
      <button type="button" class="who" id="who" aria-label="Poke the character">
        <picture>
          <source srcset="/mask.avif" type="image/avif">
          <img src="/mask.webp" alt="wermyle's masked character" width="516" height="800">
        </picture>
      </button>
      <span class="bubble" id="bubble" aria-live="polite"></span>
    </div>
    <h1>Lost in the beat</h1>
    <p>This page doesn't exist or has moved. Let's get you back to the music.</p>
    <div class="go"><a class="btn" href="/">Home</a><a class="btn line" href="/mods.html">My mods</a></div>
  </div>
</main>

<script>
/* background rows of WERMYLE */
(function(){
  const mq=document.getElementById('mq');
  function build(){
    mq.innerHTML='';
    const rows=Math.max(5,Math.round(innerHeight/130)),per=Math.max(6,Math.ceil(innerWidth/300)*2);
    for(let r=0;r<rows;r++){const row=document.createElement('div');row.className='row';row.style.animationDelay=(-r*7)+'s';
      for(let i=0;i<per*2;i++){const sp=document.createElement('span');sp.textContent='WERMYLE';row.appendChild(sp)}mq.appendChild(row)}
  }
  build();let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(build,200)});
})();
/* poke him */
(function(){
  const who=document.getElementById('who'),bubble=document.getElementById('bubble');
  const lines=['Nope, nothing here.','Hey! That tickles.','*confused beatbox*','Try the home page!','This page took a day off.','Still nothing…','Okay, okay, I get it.'];
  let n=0,t;
  who.addEventListener('click',()=>{
    who.classList.remove('shake');void who.offsetWidth;who.classList.add('shake');
    bubble.textContent=lines[n++%lines.length];bubble.classList.add('on');
    clearTimeout(t);t=setTimeout(()=>bubble.classList.remove('on'),2200);
  });
  who.addEventListener('animationend',e=>{if(e.animationName==='shake')who.classList.remove('shake')});
})();
</script>
</body>
</html>
