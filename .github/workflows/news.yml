name: Update news

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:       # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest videos and posts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_AUTHOR_ID: ${{ secrets.DISCORD_AUTHOR_ID }}
        run: python scripts/update_news.py

      - name: Save news.json if it changed
        run: |
          if git diff --quiet -- news.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update news"
          git push
